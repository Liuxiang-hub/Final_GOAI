<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#0d1117" rx="18"/>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#c9d1d9}.title{fill:#fff;font-size:28px;font-weight:700}.label{font-size:16px}.small{font-size:14px;fill:#8b949e}.grid{stroke:#30363d;stroke-width:1}.axis{stroke:#8b949e;stroke-width:1.5}.mse{fill:none;stroke:#58a6ff;stroke-width:4}.mae{fill:none;stroke:#d2a8ff;stroke-width:4}.dot1{fill:#58a6ff}.dot2{fill:#d2a8ff}.best{fill:#3fb950;stroke:#fff;stroke-width:2}
