  <g class="dot2"><circle cx="140" cy="433" r="6"/><circle cx="300" cy="478" r="6"/><circle cx="460" cy="514" r="6"/><circle cx="620" cy="546" r="6"/><circle cx="780" cy="563" r="6"/><circle cx="940" cy="566" r="6"/></g>
